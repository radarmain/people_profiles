[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[project]
name = "mtpi-userprofiles"
version = "0.1.0"
description = "User and agency profile hub with Google SSO, Slack, and HiBob enrichment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "authlib>=1.3.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.0",
    "boto3>=1.35.0",
    "duckduckgo-search>=6.3.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
