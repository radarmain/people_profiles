{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<section class="signin-shell" aria-label="Sign in">

  {% if user %}
  <a class="btn primary" href="/profile">Continue</a>
  {% elif google_ready %}
  <a class="btn primary" href="/auth/login">Sign in</a>
  {% else %}
  <span class="note">Sign-in unavailable.</span>
  {% endif %}
</section>
{% endblock %}
